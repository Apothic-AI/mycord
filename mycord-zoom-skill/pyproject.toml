[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycord-zoom-skill"
version = "0.1.0"
description = "Agent skill and CLI for Zoom with no app registration: deep-link control of the desktop client plus a PipeWire virtual audio device pair for real call audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["zoom", "agent", "automation", "pipewire", "pulseaudio", "voice", "asr", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# No Python runtime dependencies. The audio plane is `pactl`/`pacat`/`parec`,
# speech is Piper + the gvoice ASR workers, and the desktop client is launched by
# URL. All of them are external processes this package shells out to, and turning
# any of them into a Python dependency would only hide that they are missing.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mycord-zoom = "mycord_zoom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycord_zoom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `tests/` holds the fake audio server and shared fixtures alongside the test modules;
# putting it on the path lets them import as plain modules without a package install.
pythonpath = ["tests"]
markers = [
    "unit: pure/local tests; no audio server, no Zoom client",
    "live: talks to the real PipeWire server; skipped unless `pactl` can reach one",
]
