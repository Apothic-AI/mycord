[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycord-signal-skill"
version = "0.1.0"
description = "Agent skill and CLI for Signal: dependency pinning, JSON-RPC client and the 1:1 voice call path, with no bot or app registration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["signal", "repl", "agent", "automation", "voice", "signal-cli", "ringrtc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Standard library only. The transport is a newline-JSON Unix socket and the media is raw
# PCM on a Unix socket, so a dependency would add attack surface without removing work.
# `signal-cli` and `signal-call-tunnel` are external binaries this package shells out to;
# they are version-pinned in scripts/provision.sh and detected by `doctor`.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mycord-signal = "mycord_signal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycord_signal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    # The CLI's argparse dispatch table is a heterogeneous dict of callables; annotating it
    # precisely buys nothing and obscures the flow.
    "ANN401",
    # Nested `with` blocks read better than a single comma-joined line in the socket tests,
    # where each context manager is a distinct setup step with its own meaning.
    "SIM117",
    # `try/except/pass` is clearer than `contextlib.suppress` at the exact call sites here,
    # which are all "best-effort shutdown of a socket that may already be gone".
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise private helpers deliberately (that is what makes them regression tests for
# the wire format) and use fixtures whose names read better untyped.
"tests/*" = ["ANN001", "ANN201", "ANN202", "SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `tests/` holds the fake daemon and shared fixtures next to the test modules; putting it on
# the path lets them import as plain modules without a package install.
pythonpath = ["tests"]
markers = [
    "unit: pure/local tests; no network, no credentials, no real binaries",
    "live: needs the running signal-cli daemon and a linked account; skipped by default",
]
