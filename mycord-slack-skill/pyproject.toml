[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycord-slack-skill"
version = "0.1.0"
description = "Agent skill and CLI for Slack with no app registration: session capture, slackdump reads, and a full API passthrough"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["slack", "repl", "agent", "automation", "slackdump", "slack-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# slack_sdk is the only runtime dependency: it is the write path *and* the passthrough.
# slackdump is an external binary this package shells out to for reads, not a Python dep.
dependencies = [
    "slack-sdk>=3.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mycord-slack = "mycord_slack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mycord_slack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `tests/` holds the fake Slack server and shared fixtures alongside the test modules;
# putting it on the path lets them import as plain modules without a package install.
pythonpath = ["tests"]
markers = [
    "unit: pure/local tests; no network, no credentials",
    "live: talks to the real Slack workspace; skipped unless a usable session exists",
]
