[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mycord"
version = "0.1.0"
description = "FastMCP server for Discord integration via discord.py-self"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Apothic Team"}
]
license = {text = "MIT"}
keywords = ["mcp", "discord", "fastmcp", "discord.py-self", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=4.0.10",
    "discord.py-self>=2.1.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[project.scripts]
mycord = "mycord.app.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mycord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=mycord",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--strict-markers",
    "--asyncio-mode=auto"
]
markers = [
    "unit: Unit tests for pure functions and contracts",
    "integration: Integration tests with Discord adapter mocks",
    "slow: Tests that take significant time to run"
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # Use of assert (OK in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "PLC0415", "ARG001"]  # Allow assert, missing annotations, magic values, imports in tests, unused fixtures
"mycord/app/server.py" = ["PLW0603", "G201"]  # Allow global statement for singleton pattern, exc_info=True
"mycord/adapters/discord_client.py" = ["RUF006", "PLC0415"]  # Allow asyncio.create_task without storing reference, import in function

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.coverage.run]
source = ["mycord"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
